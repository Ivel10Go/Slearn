name: Desktop

# Baut die Installer der Desktop-App (Electron + eingefrorenes Backend).
#
# Jeder Installer entsteht auf seinem eigenen System, weil PyInstaller nicht
# quer kompiliert: Windows auf Windows, macOS auf einem Mac - und zwar je
# Architektur auf einem eigenen Runner. Ein DMG mit arm64- und x64-Electron,
# aber nur einem Backend, wuerde auf dem jeweils anderen Mac nicht starten.
#
# Signieren: sind die Repository-Secrets gesetzt, signiert electron-builder
# selbst - ohne sie entsteht wie bisher ein unsignierter Installer (Windows
# zeigt dann SmartScreen, macOS verlangt Rechtsklick -> "Oeffnen", und der
# Mac-Updater kann nicht installieren). Die Secrets:
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD   Windows-Zertifikat (.pfx, base64)
#   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD   "Developer ID Application" (.p12, base64)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   Notarisierung
# Siehe docs/desktop.md, "Signieren und Veroeffentlichen".
#
# Veroeffentlichen: bei einem Tag `v*` sammelt der Job `release` die Installer
# aller drei Builds und die `latest*.yml` der Auto-Updates in *einen*
# Release-*Entwurf*. Erst das Veroeffentlichen des
# Entwurfs auf GitHub macht das Update fuer installierte Apps sichtbar.
# `workflow_dispatch` baut nur und laedt die Installer als Artefakt hoch.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  # Fuer den Release-Entwurf bei einem Tag; sonst wird nur gelesen.
  contents: write

jobs:
  installer:
    name: installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            builder: --win --x64
          - name: macos-arm64
            os: macos-14
            builder: --mac --arm64
          - name: macos-x64
            # Das Intel-Image `macos-13` ist abgeschaltet - ein Job darauf
            # bleibt ohne Fehlermeldung fuer immer "queued", weil kein Runner
            # das Label mehr annimmt. `macos-15-intel` ist GitHubs Intel-Image.
            os: macos-15-intel
            builder: --mac --x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tag matches app version
        # Der Updater vergleicht die Version aus package.json. Ein Tag v1.2.0
        # auf einem Stand mit 1.1.0 waere ein Release, das sich nie anbietet.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zu desktop/package.json (${version})."
            exit 1
          fi
      - name: install frontend
        working-directory: frontend
        run: npm ci
      - name: install desktop
        working-directory: desktop
        run: npm ci
      - name: check desktop
        working-directory: desktop
        run: npm run check
      - name: build backend (PyInstaller)
        working-directory: desktop
        run: npm run build:backend
      - name: smoke-test frozen backend
        # Startet das eingefrorene Backend gegen eine leere Datenbank: prueft,
        # dass Migrationen und alle versteckten Importe im Bundle sind. Ein
        # fehlendes Modul faellt sonst erst beim Nutzer auf.
        working-directory: desktop
        shell: bash
        run: node scripts/smoke-backend.mjs
      - name: build frontend (Next standalone)
        working-directory: desktop
        run: npm run build:frontend
      - name: package
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ein fehlendes Secret kommt als leerer String an, und den nimmt
          # electron-builder als Pfad ("desktop not a file"). Deshalb entfernt
          # der Schritt leere Werte vor dem Aufruf, siehe unten.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Ohne Zertifikat nicht nach einer zufaelligen Identitaet im
          # Schluesselbund suchen.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}
        run: |
          for name in WIN_CSC_LINK WIN_CSC_KEY_PASSWORD CSC_LINK CSC_KEY_PASSWORD \
                      APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then unset "$name"; fi
          done
          # Veroeffentlicht wird nie aus der Matrix: drei parallele Jobs legten
          # bei v1.1.0 zwei Release-Entwuerfe an, und der x64-Mac ueberschrieb
          # die latest-mac.yml des arm64-Macs. Das macht der Job `release`.
          npx electron-builder ${{ matrix.builder }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Slearn-${{ matrix.name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          if-no-files-found: error

  release:
    # Ein einziger Entwurf je Tag, erst wenn alle drei Installer gebaut sind.
    # Erst das Veroeffentlichen des Entwurfs auf GitHub macht das Update fuer
    # installierte Apps sichtbar.
    name: release draft
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: merge latest-mac.yml
        # Beide Mac-Jobs schreiben eine latest-mac.yml mit nur ihrer
        # Architektur. electron-updater waehlt aus *einer* Datei die passende
        # Architektur aus, deshalb muessen beide Listen zusammen.
        run: |
          mkdir release
          node .github/ci/merge-latest-mac.mjs artifacts/Slearn-macos-x64/latest-mac.yml artifacts/Slearn-macos-arm64/latest-mac.yml > release/latest-mac.yml
          find artifacts -type f ! -name latest-mac.yml -exec cp {} release/ \;
          ls -l release
      - name: release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "### Downloads"
            echo
            echo "| System | File |"
            echo "| --- | --- |"
            echo "| Windows (x64) | \`Slearn-Setup-${version}.exe\` |"
            echo "| macOS Apple Silicon | \`Slearn-${version}-arm64.dmg\` |"
            echo "| macOS Intel | \`Slearn-${version}-x64.dmg\` |"
            echo
            echo "> Unsigned installers: Windows *More info → Run anyway*; macOS *right-click → Open*."
            echo
            echo "---"
            echo
            awk -v v="## [${version}]" 'index($0, v) == 1 {on = 1; next} on && /^## \[/ {exit} on' CHANGELOG.md
          } > notes.md
          cat notes.md
      - name: create draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --draft --title "Slearn ${GITHUB_REF_NAME#v}" --notes-file notes.md
