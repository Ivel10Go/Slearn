name: school-assistant

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set in .env}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - type: bind
        source: ./postgres/init
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in .env}"
      APP_ENV: "${APP_ENV:-development}"
      DEBUG: "${DEBUG:-false}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set in .env}"
      INTEGRATION_ENCRYPTION_KEY: "${INTEGRATION_ENCRYPTION_KEY:?INTEGRATION_ENCRYPTION_KEY must be set in .env}"
      INTEGRATION_TIMEOUT_SECONDS: "${INTEGRATION_TIMEOUT_SECONDS:-10}"
      WEBUNTIS_SYNC_ENABLED: "${WEBUNTIS_SYNC_ENABLED:-true}"
      WEBUNTIS_SYNC_INTERVAL_SECONDS: "${WEBUNTIS_SYNC_INTERVAL_SECONDS:-86400}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}"
      BOOTSTRAP_ON_STARTUP: "${BOOTSTRAP_ON_STARTUP:-true}"
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      DEMO_MODE: "${DEMO_MODE:-false}"
      SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:-school_session}"
      SESSION_MAX_AGE_SECONDS: "${SESSION_MAX_AGE_SECONDS:-604800}"
      # Hinter einem TLS-Reverse-Proxy MUSS SESSION_COOKIE_SECURE=true sein. Compose leitet
      # den Wert NICHT aus APP_ENV=production ab, weil dieselbe Datei lokal im Klartext
      # benutzt wird. docs/server.md, Abschnitt "Betrieb hinter HTTPS".
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      SESSION_COOKIE_HTTPONLY: "${SESSION_COOKIE_HTTPONLY:-true}"
      SESSION_COOKIE_SAMESITE: "${SESSION_COOKIE_SAMESITE:-lax}"
      SESSION_COOKIE_DOMAIN: "${SESSION_COOKIE_DOMAIN:-}"
      LOGIN_RATE_LIMIT: "${LOGIN_RATE_LIMIT:-5}"
      LOGIN_RATE_WINDOW_SECONDS: "${LOGIN_RATE_WINDOW_SECONDS:-60}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      SCHOOL_TIMEZONE: "${SCHOOL_TIMEZONE:-Europe/Berlin}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_TIMEOUT_SECONDS: "${AI_TIMEOUT_SECONDS:-60}"
      AI_MAX_TOKENS: "${AI_MAX_TOKENS:-2048}"
      WEBUNTIS_BASE_URL: "${WEBUNTIS_BASE_URL:-}"
      WEBUNTIS_SCHOOL: "${WEBUNTIS_SCHOOL:-}"
      WEBUNTIS_USERNAME: "${WEBUNTIS_USERNAME:-}"
      WEBUNTIS_PASSWORD: "${WEBUNTIS_PASSWORD:-}"
      ICAL_CALENDAR_URL: "${ICAL_CALENDAR_URL:-}"
      CALENDAR_REFRESH_INTERVAL_SECONDS: "${CALENDAR_REFRESH_INTERVAL_SECONDS:-900}"
      DOCUMENT_STORAGE_PATH: "/var/lib/school-assistant/documents"
      IMPORT_STORAGE_PATH: "/var/lib/school-assistant/imports"
      BACKUP_STORAGE_PATH: "/var/lib/school-assistant/backups"
      # Der Reminder-Thread laeuft aus wie der WebUntis-Scheduler: in Settings
      # bewusst aus, damit ein nativer Start keine ungefragten Nebenwirkungen
      # hat, im Compose-Stack an.
      REMINDER_SCHEDULER_ENABLED: "${REMINDER_SCHEDULER_ENABLED:-true}"
      # Web-Push. Ohne Schluesselpaar (leer) bleibt es bei lokalen
      # Benachrichtigungen der offenen Seite; ohne diese Zeilen kaeme ein in
      # .env gesetzter Schluessel im Container nie an (kein env_file).
      WEB_PUSH_VAPID_PUBLIC_KEY: "${WEB_PUSH_VAPID_PUBLIC_KEY:-}"
      WEB_PUSH_VAPID_PRIVATE_KEY: "${WEB_PUSH_VAPID_PRIVATE_KEY:-}"
      WEB_PUSH_VAPID_SUBJECT: "${WEB_PUSH_VAPID_SUBJECT:-}"
      # Lokale Modelle. Muss read/write sein, sonst liegen die Gewichte nach
      # einem Neustart nur im Container-Overlay und sind weg.
      MODEL_STORAGE_PATH: "/var/lib/school-assistant/models"
      MODEL_DOWNLOAD_TIMEOUT_SECONDS: "${MODEL_DOWNLOAD_TIMEOUT_SECONDS:-60}"
      MODEL_MIN_FREE_BYTES: "${MODEL_MIN_FREE_BYTES:-536870912}"
      # Sprach-Assistent. whisper.cpp bringt seinen eigenen HTTP-Dienst mit und
      # laeuft ausserhalb des Python-Prozesses; Piper ist ein Kommandozeilenwerk.
      # Beide sind bewusst nicht Teil des Images - der Textmodus ist der
      # Normalzustand, und ein 200-MB-Rad ohne Importeintrag waere schlechter
      # als keins. ffmpeg dagegen ist im Image (siehe backend/Dockerfile).
      SPEECH_ENABLED: "${SPEECH_ENABLED:-false}"
      WHISPER_SERVER_URL: "${WHISPER_SERVER_URL:-}"
      WHISPER_LANGUAGE: "${WHISPER_LANGUAGE:-de}"
      PIPER_BINARY_PATH: "${PIPER_BINARY_PATH:-}"
      # Lokale KI-Routen: lokal zuerst, mit kuerzerem Budget wenn ein
      # Online-Provider im Rueckgrat steht.
      AI_LOCAL_FIRST: "${AI_LOCAL_FIRST:-true}"
      AI_LOCAL_TIMEOUT_SECONDS: "${AI_LOCAL_TIMEOUT_SECONDS:-60}"
      AI_LOCAL_FAST_TIMEOUT_SECONDS: "${AI_LOCAL_FAST_TIMEOUT_SECONDS:-15}"
      AI_GENERATE_TIMEOUT_SECONDS: "${AI_GENERATE_TIMEOUT_SECONDS:-30}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: "${DOCUMENTS_HOST_PATH:-./data/documents}"
        target: /var/lib/school-assistant/documents
        read_only: false
        bind:
          create_host_path: true
      - type: bind
        source: "${BACKUPS_HOST_PATH:-./data/backups}"
        target: /var/lib/school-assistant/backups
        read_only: false
        bind:
          create_host_path: true
      - type: bind
        source: "${IMPORTS_HOST_PATH:-./data/imports}"
        target: /var/lib/school-assistant/imports
        read_only: false
        bind:
          create_host_path: true
      - type: bind
        source: "${MODELS_HOST_PATH:-./data/models}"
        target: /var/lib/school-assistant/models
        read_only: false
        bind:
          create_host_path: true
      # Nur lesend: das Backend liest das Status-JSON des Workers fuer
      # `GET /api/v1/backups/status`. Ohne diesen Mount antwortet der
      # Endpunkt dauerhaft mit `available: false`, weil die Datei fuer das
      # Backend nicht existiert - nicht weil das Backup fehlschlaegt.
      - type: volume
        source: worker-status
        target: /var/lib/school-assistant/worker-status
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in .env}"
      APP_ENV: "${APP_ENV:-development}"
      SCHOOL_TIMEZONE: "${SCHOOL_TIMEZONE:-Europe/Berlin}"
      WORKER_POLL_INTERVAL_SECONDS: "${WORKER_POLL_INTERVAL_SECONDS:-300}"
      WORKER_HEARTBEAT_INTERVAL_SECONDS: "${WORKER_HEARTBEAT_INTERVAL_SECONDS:-30}"
      WORKER_HEALTH_MAX_AGE_SECONDS: "${WORKER_HEALTH_MAX_AGE_SECONDS:-120}"
      WORKER_STATUS_PATH: "/var/lib/school-assistant/worker-status/worker-status.json"
      DOCUMENT_STORAGE_PATH: "/var/lib/school-assistant/documents"
      IMPORT_STORAGE_PATH: "/var/lib/school-assistant/imports"
      BACKUP_STORAGE_PATH: "/var/lib/school-assistant/backups"
      # Der Runner legt den Dump im selben Verzeichnis ab, an dem der Host bindet.
      # Deshalb read-write - ein read_only-Mount laeuft in einen PermissionError.
      BACKUP_ENABLED: "${BACKUP_ENABLED:-true}"
      BACKUP_SCHEDULE: "${BACKUP_SCHEDULE:-0 2 * * *}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-30}"
      BACKUP_PG_DUMP_BINARY: "${BACKUP_PG_DUMP_BINARY:-}"
    volumes:
      - type: volume
        source: worker-status
        target: /var/lib/school-assistant/worker-status
        read_only: false
      - type: bind
        source: "${DOCUMENTS_HOST_PATH:-./data/documents}"
        target: /var/lib/school-assistant/documents
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: "${BACKUPS_HOST_PATH:-./data/backups}"
        target: /var/lib/school-assistant/backups
        read_only: false
        bind:
          create_host_path: true
      - type: bind
        source: "${IMPORTS_HOST_PATH:-./data/imports}"
        target: /var/lib/school-assistant/imports
        read_only: true
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "python", "-m", "worker.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_INTERNAL_URL: "http://backend:8000"
      NEXT_PUBLIC_ENABLE_DEMO_FALLBACK: "${NEXT_PUBLIC_ENABLE_DEMO_FALLBACK:-false}"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

volumes:
  pgdata:
  worker-status:
