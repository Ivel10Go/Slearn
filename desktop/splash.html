<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Lernraum</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #0a0a0a;
        --muted: #6e6e6e;
        --track: #ededed;
      }
      :root[data-theme="dark"] {
        --bg: #0a0a0a;
        --fg: #ededed;
        --muted: #8c8c8c;
        --track: #1f1f1f;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-app-region: drag;
        user-select: none;
      }
      .mark {
        display: block;
        width: 40px;
        height: 40px;
        border-radius: 9px;
      }
      .mark-bg { fill: #e9e9e9; }
      [data-theme="dark"] .mark-bg { fill: #0a0a0a; }
      .name {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .status {
        color: var(--muted);
      }
      .bar {
        position: relative;
        width: 120px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: var(--track);
      }
      .bar::after {
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 2px;
        background: var(--fg);
        animation: slide 1.1s ease-in-out infinite;
        content: "";
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar::after {
          animation: none;
          width: 100%;
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <svg class="mark" viewBox="0 0 120 120" aria-hidden="true"><rect class="mark-bg" width="120" height="120"/><g transform="translate(60 60) scale(1.5) translate(-60 -58)"><ellipse cx="60" cy="58" rx="31" ry="27" fill="#cdcdcd" stroke="#0a0a0a" stroke-width="2.4"/><path d="M60 43C76 43 85 52 85 63C85 74 74 81 60 81C46 81 35 74 35 63C35 52 44 43 60 43Z" fill="#fff"/><ellipse cx="41" cy="71" rx="4" ry="2.5" fill="#ececec"/><ellipse cx="79" cy="71" rx="4" ry="2.5" fill="#ececec"/><path d="M56 56.5C52 51.5 42 54.5 37 63C35 67.5 39 70 43.5 68C50.5 65 58 61.5 56 56.5Z" fill="#0a0a0a"/><path d="M64 56.5C68 51.5 78 54.5 83 63C85 67.5 81 70 76.5 68C69.5 65 62 61.5 64 56.5Z" fill="#0a0a0a"/><circle cx="48.5" cy="60.5" r="3.4" fill="#fff"/><circle cx="71.5" cy="60.5" r="3.4" fill="#fff"/><circle cx="48.9" cy="60.9" r="2" fill="#0a0a0a"/><circle cx="71.9" cy="60.9" r="2" fill="#0a0a0a"/><ellipse cx="60" cy="66" rx="4.4" ry="2.9" fill="#0a0a0a"/><path d="M54.5 70.5q2.75 3 5.5 0q2.75 3 5.5 0" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round"/></g></svg>
    <div class="name">Lernraum</div>
    <div class="bar" role="progressbar" aria-label="Wird gestartet"></div>
    <div class="status">Wird gestartet …</div>
    <script>
      document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light";
    </script>
  </body>
</html>
