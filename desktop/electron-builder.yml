# Baut die Installer. Vorher muessen `resources/backend` (PyInstaller) und
# `resources/frontend` (Next standalone) existieren - `npm run dist` erledigt
# beides. Ein Installer laesst sich nur auf dem eigenen System bauen: Windows
# auf Windows, macOS auf einem Mac (PyInstaller kann nicht quer kompilieren).
appId: app.lernraum.desktop
productName: Lernraum
copyright: Copyright © 2026 Lernraum, AGPL-3.0-or-later
directories:
  output: dist
  buildResources: assets
files:
  - main.js
  - preload.js
  - splash.html
  - lib/runtime.js
  - lib/updates.js
  - assets/tray.png
  - assets/trayTemplate.png
  - assets/trayTemplate@2x.png
  - package.json
extraResources:
  - from: resources/backend
    to: backend
  # Ohne den Filter laesst electron-builder den Punkt-Ordner `.next` weg, und
  # Ordner namens `node_modules` filtert er in jedem Fall heraus - deshalb ein
  # eigener Eintrag, der direkt *aus* dem Ordner kopiert. Fehlt einer der
  # beiden, startet der Next-Server mit "Cannot find module 'next'" bzw. ohne
  # CSS und JS.
  - from: resources/frontend
    to: frontend
    filter:
      - "**/*"
      - ".next/**/*"
  - from: resources/frontend/node_modules
    to: frontend/node_modules
    filter:
      - "**/*"
  # Die Lizenz liegt jeder Installation bei (AGPL-3.0, Abschnitt 4 und 6).
  - from: ../LICENSE
    to: LICENSE.txt
  # Die Skripte des LoRA-Trainers und seine Sperrdatei. Sein Python (torch/CUDA,
  # mehrere GB) richtet das Backend auf /ki selbst ein (trainer_install.py) -
  # ohne die *.lock-Datei hier fände es keine Paketliste.
  - from: ../trainer
    to: trainer
    filter:
      - "*.py"
      - "requirements*.txt"
      - "requirements-*.lock"
asar: true

# Updates kommen aus den GitHub-Releases dieses Repositorys. `desktop.yml`
# laedt bei einem Tag `v*` Installer und `latest*.yml` als Entwurf hoch; erst
# wenn der Entwurf veroeffentlicht ist, sehen die installierten Apps ihn.
publish:
  provider: github
  owner: Ivel10Go
  repo: School-assistant
  releaseType: draft

win:
  target: nsis
  icon: assets/icon.ico
  artifactName: Lernraum-Setup-${version}.${ext}

nsis:
  # Ein-Klick-Installation ohne Adminrechte: installiert fuer den aktuellen
  # Benutzer, legt Start- und Desktop-Verknuepfung an und startet danach.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lernraum
  # Die Lerndaten liegen im Benutzerprofil und ueberleben eine Deinstallation.
  deleteAppDataOnUninstall: false

mac:
  # Die Architektur kommt vom Aufruf (`--arm64`/`--x64`), nicht von hier: das
  # eingefrorene Backend gibt es nur fuer die Architektur des bauenden Macs.
  # Das ZIP braucht der Updater (er installiert kein DMG), das DMG die
  # Erstinstallation.
  target:
    - dmg
    - zip
  category: public.app-category.education
  icon: assets/icon.icns
  artifactName: Lernraum-${version}-${arch}.${ext}
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  # Signiert und notarisiert wird, sobald die Secrets im Workflow gesetzt sind
  # (CSC_LINK/CSC_KEY_PASSWORD, APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/
  # APPLE_TEAM_ID) - electron-builder erkennt sie selbst. Ohne sie entsteht
  # eine unsignierte App wie bisher.
  extendInfo:
    NSMicrophoneUsageDescription: Lernraum nutzt das Mikrofon nur, wenn du eine Frage diktierst.

dmg:
  title: Lernraum
